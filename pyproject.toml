[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "landslide-gnn"
version = "0.1.0"
description = "Low-cost landslide monitoring with a graph neural network over IMU, GNSS and weather data"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Made Harta Dwijaksara", email = "made.harta@cs.ui.ac.id" },
  { name = "Yudhidya Wicaksana" },
  { name = "Dwi Sarah" },
  { name = "Ahmad Nasikun" },
]
dependencies = ["torch>=2.1", "numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3", "pyyaml>=6.0"]
keywords = ["landslide", "early warning", "graph neural network", "IoT", "LoRa", "IMU", "GNSS"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
landslide-gnn = "landslide_gnn.cli:main"

[tool.setuptools.packages.find]
include = ["landslide_gnn*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
